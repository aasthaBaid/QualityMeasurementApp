<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quantity Measurement</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
<link href="style.css" rel="stylesheet">
</head>
<body>

  <!-- HEADER -->
  <header class="app-header text-center">
    <h1>Welcome To Quantity Measurement</h1>
  </header>

  <!-- MAIN -->
  <main class="container py-5">

    <!-- CHOOSE TYPE -->
    <p class="section-label">Choose Type</p>
    <div class="row g-3 mb-5">

      <div class="col-6 col-md-3">
        <div class="type-card active" id="type-length">
          <span class="type-icon">📏</span>
          <span class="type-label">Length</span>
        </div>
      </div>

      <div class="col-6 col-md-3">
        <div class="type-card" id="type-weight">
          <span class="type-icon">⚖️</span>
          <span class="type-label">Weight</span>
        </div>
      </div>

      <div class="col-6 col-md-3">
        <div class="type-card" id="type-temperature">
          <span class="type-icon">🌡️</span>
          <span class="type-label">Temperature</span>
        </div>
      </div>

      <div class="col-6 col-md-3">
        <div class="type-card" id="type-volume">
          <span class="type-icon">🧪</span>
          <span class="type-label">Volume</span>
        </div>
      </div>

    </div>

    <!-- CHOOSE ACTION -->
    <p class="section-label">Choose Action</p>
    <div class="row g-3 mb-5">

      <div class="col-12 col-md-4">
        <button class="action-btn active" id="action-comparison">Comparison</button>
      </div>
      <div class="col-12 col-md-4">
        <button class="action-btn" id="action-conversion">Conversion</button>
      </div>
      <div class="col-12 col-md-4">
        <button class="action-btn" id="action-arithmetic">Arithmetic</button>
      </div>

    </div>

    <!-- FROM / TO -->
    <div class="row g-4">

      <!-- FROM -->
      <div class="col-12 col-md-6">
        <p class="section-label">From</p>
        <div class="input-card">
          <div class="value-display">1</div>
          <select id="unit-from">
            <option selected>Kilometer</option>
            <option>Meter</option>
            <option>Centimeter</option>
            <option>Millimeter</option>
            <option>Mile</option>
            <option>Yard</option>
            <option>Foot</option>
            <option>Inch</option>
          </select>
        </div>
      </div>

      <!-- TO -->
      <div class="col-12 col-md-6">
        <p class="section-label">To</p>
        <div class="input-card">
          <div class="value-display">1000</div>
          <select id="unit-to">
            <option>Kilometer</option>
            <option selected>Meter</option>
            <option>Centimeter</option>
            <option>Millimeter</option>
            <option>Mile</option>
            <option>Yard</option>
            <option>Foot</option>
            <option>Inch</option>
          </select>
        </div>
      </div>

    </div>
    <!-- end row -->

  </main>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

 

</body>
</html>
