<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quantity Measurement</title>

  <link rel="icon" href="data:,">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="style.css" rel="stylesheet">
</head>

<body>

  <!-- HEADER -->
  <header class="app-header text-center">
    <h1>Quantity Measurement</h1>
  </header>

  <main class="container py-5">

    <!-- TYPE -->
    <p class="section-label">Choose Type</p>
    <div class="row g-3 mb-5">

      <div class="col-6 col-md-3">
        <div class="type-card active" id="type-length">
          <span class="type-icon">📏</span>
          <span class="type-label">Length</span>
        </div>
      </div>

      <div class="col-6 col-md-3">
        <div class="type-card" id="type-weight">
          <span class="type-icon">⚖️</span>
          <span class="type-label">Weight</span>
        </div>
      </div>

      <div class="col-6 col-md-3">
        <div class="type-card" id="type-temperature">
          <span class="type-icon">🌡️</span>
          <span class="type-label">Temperature</span>
        </div>
      </div>

      <div class="col-6 col-md-3">
        <div class="type-card" id="type-volume">
          <span class="type-icon">🧪</span>
          <span class="type-label">Volume</span>
        </div>
      </div>

    </div>

    <!-- ACTION -->
    <p class="section-label">Choose Action</p>
    <div class="row g-3 mb-5">

      <div class="col-12 col-md-4">
        <button class="action-btn active" id="action-comparison">Comparison</button>
      </div>

      <div class="col-12 col-md-4">
        <button class="action-btn" id="action-conversion">Conversion</button>
      </div>

      <div class="col-12 col-md-4">
        <button class="action-btn" id="action-arithmetic">Arithmetic</button>
      </div>

    </div>

    <!-- ================= NORMAL MODE ================= -->
    <div id="normal-block" class="row g-4">

      <!-- FROM -->
      <div class="col-12 col-md-6">
        <p class="section-label">From</p>
        <div class="input-card p-3">
          <input type="number" id="from-value" value="1" class="form-control mb-3" style="font-size: 2rem;">
          <select id="unit-from" class="form-select"></select>
        </div>
      </div>

      <!-- TO -->
      <div class="col-12 col-md-6">
        <p class="section-label">To</p>
        <div class="input-card p-3">
          <select id="unit-to" class="form-select"></select>
        </div>
      </div>

    </div>

    <!-- ================= ARITHMETIC MODE ================= -->
    <div id="arithmetic-layout" style="display: none;">

      <div class="row align-items-center g-4">

        <!-- VALUE 1 -->
        <div class="col-md-5">
          <p class="section-label">Value 1</p>
          <div class="input-card p-3">
            <input type="number" id="arith-value1" value="1" class="form-control mb-3" style="font-size: 2rem;">
            <select id="arith-unit1" class="form-select"></select>
          </div>
        </div>

        <!-- OPERATOR -->
        <div class="col-md-2 text-center">
          <select id="operator" class="form-select mx-auto" style="max-width: 80px;">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">×</option>
            <option value="/">÷</option>
          </select>
        </div>

        <!-- VALUE 2 -->
        <div class="col-md-5">
          <p class="section-label">Value 2</p>
          <div class="input-card p-3">
            <input type="number" id="arith-value2" value="1" class="form-control mb-3" style="font-size: 2rem;">
            <select id="arith-unit2" class="form-select"></select>
          </div>
        </div>

      </div>

      <!-- RESULT UNIT -->
      <div class="mt-4">
        <div class="input-card p-3">
          <p class="section-label">Result Unit</p>
          <select id="arith-result-unit" class="form-select"></select>
        </div>
      </div>

    </div>

    <!-- ================= COMMON RESULT ================= -->
    <div class="mt-4">
      <div class="input-card p-4">

        <p class="section-label">Result</p>

        <div class="value-display">
          <span id="result-value">0</span>
          <span id="result-unit"></span>
        </div>

      </div>
    </div>

<div class="mt-5">

  <button id="toggle-history" class="btn btn-dark mb-3">
    Show History
  </button>

  <div id="history-container" style="display: none;">
    <ul id="history-list" class="list-group"></ul>
  </div>

</div>
  </main>

  <!-- JS -->
  <script type="module" src="js/app.js"></script>

</body>

</html>
